# pubspec.yaml
name: convertit
description: A Flutter file converter app powered by CloudConvert API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  http: ^1.2.0
  dio: ^5.4.0
  path_provider: ^2.1.2
  open_filex: ^4.3.4
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  image: ^4.1.3
  permission_handler: ^11.3.0
  flutter_svg: ^2.0.10+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true