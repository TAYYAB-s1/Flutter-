name: sanitary_store
description: Voice-search sanitary/hardware inventory app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Phase 1 — local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Phase 3 — add/edit products (image picking, unique ids)
  image_picker: ^1.1.2
  uuid: ^4.4.0

  # Added: explicit dependency for copying picked photos to permanent
  # storage (was previously only available transitively via
  # image_picker — now used directly in add_edit_product_screen.dart
  # to fix photos being lost when Android clears the app cache).
  path_provider: ^2.1.1

  # Phase 4 — voice search
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Phase 5 — fuzzy matching for search (voice + typed)
  string_similarity: ^2.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/categories/